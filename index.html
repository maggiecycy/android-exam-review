<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Android 期末复习</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <p class="brand-kicker">金融系统应用开发与实践</p>
        <h1>期末复习站</h1>
      </div>
      <nav id="chapter-nav" class="chapter-nav" aria-label="章节"></nav>
      <p class="sidebar-note">第一到五章 + 必备知识点 + 可视化演练 + 五套综合模拟题。</p>
    </aside>

    <main class="main">
      <header class="main-header">
        <div>
          <p id="chapter-meta" class="chapter-meta"></p>
          <h2 id="chapter-title"></h2>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab is-active" data-tab="knowledge" role="tab" aria-selected="true">知识点</button>
          <button type="button" class="tab" data-tab="quiz" role="tab" aria-selected="false">测试</button>
        </div>
      </header>

      <section id="panel-knowledge" class="panel is-active" role="tabpanel"></section>
      <section id="panel-quiz" class="panel" role="tabpanel" hidden></section>
    </main>
  </div>

  <script src="js/data/ch01.js"></script>
  <script src="js/data/ch02.js"></script>
  <script src="js/data/ch03.js"></script>
  <script src="js/data/ch04.js"></script>
  <script src="js/data/ch05.js"></script>
  <script src="js/data/essentials.js"></script>
  <script src="js/data/lab.js"></script>
  <script src="js/data/mock.js"></script>
  <script src="js/data/chapters.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
